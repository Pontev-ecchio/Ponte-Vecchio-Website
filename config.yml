# Admin-Bereich der Ponte-Vecchio-Website (Decap CMS)
# Login mit GitHub. Zugriff hat jeder, der Schreibrechte auf das GitHub-Repository hat:
#   - Inhaber = Eigentümer des Repositorys (volle Rechte)
#   - Anton   = eingeladener Mitarbeiter (Collaborator)

backend:
  name: github
  repo: Pontev-ecchio/Ponte-Vecchio-Website
  branch: main
  commit_messages:
    update: "Inhalt geändert: {{slug}}"

locale: de
site_url: https://pontevecchio-regensburg.com
display_url: https://pontevecchio-regensburg.com
logo_url: /favicon.svg
media_folder: static/img
public_folder: /img

collections:
  - name: inhalte
    label: Website-Inhalte
    editor: { preview: false }
    files:

      - name: oeffnungszeiten
        label: Öffnungszeiten
        file: oeffnungszeiten.json
        format: json
        fields:
          - label: Wochentage
            name: tage
            widget: list
            allow_add: false
            allow_remove: false
            summary: "{{fields.tag}}"
            fields:
              - { label: Tag, name: tag, widget: string }
              - label: Zeiten (leer lassen = Ruhetag)
                name: zeiten
                widget: list
                required: false
                summary: "{{fields.von}}–{{fields.bis}}"
                fields:
                  - { label: Von (z. B. 10:00), name: von, widget: string, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Bitte als HH:MM eingeben, z. B. 17:30"] }
                  - { label: Bis (z. B. 21:00), name: bis, widget: string, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Bitte als HH:MM eingeben, z. B. 21:00"] }
          - { label: Hinweis unter den Öffnungszeiten, name: hinweis, widget: string, required: false }
          - { label: "Sonderhinweis oben auf der Seite (z. B. Betriebsurlaub). Leer = kein Hinweis", name: sonderhinweis, widget: string, required: false }

      - name: speisekarte
        label: Speisekarte
        file: speisekarte.json
        format: json
        fields:
          - label: Kategorien
            name: kategorien
            widget: list
            summary: "{{fields.titel}}"
            fields:
              - { label: Name der Kategorie, name: titel, widget: string }
              - { label: Hinweis (optional, z. B. Nudelsorte), name: hinweis, widget: string, required: false }
              - label: Gerichte
                name: gerichte
                widget: list
                summary: "{{fields.name}} – {{fields.preis}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Beschreibung / Zutaten, name: beschreibung, widget: string, required: false }
                  - { label: "Preis (z. B. 12,00 €)", name: preis, widget: string }
              - label: Extrazutaten (nur bei Pizza nötig)
                name: extras
                widget: list
                required: false
                summary: "{{fields.preis}}"
                fields:
                  - { label: "Preis (z. B. 2,00 €)", name: preis, widget: string }
                  - { label: Zutaten, name: zutaten, widget: string }
          - { label: Text unter der Speisekarte, name: fusszeile, widget: text, required: false }

      - name: betrieb
        label: Kontakt & Grunddaten
        file: betrieb.json
        format: json
        fields:
          - { label: Name des Lokals, name: name, widget: string }
          - { label: Straße und Hausnummer, name: strasse, widget: string }
          - { label: PLZ, name: plz, widget: string }
          - { label: Ort, name: ort, widget: string }
          - { label: Telefon, name: telefon, widget: string }
          - { label: Preisniveau, name: preisniveau, widget: string }
          - { label: "Instagram-Link (z. B. https://www.instagram.com/pontevecchio.regensburg) – leer = kein Symbol", name: instagram, widget: string, required: false }
          - { label: "Facebook-Link (z. B. https://www.facebook.com/pontevecchio.regensburg) – leer = kein Symbol", name: facebook, widget: string, required: false }
          - { label: "Meta-Pixel-ID (nur Ziffern, aus dem Meta Events Manager). Leer = kein Pixel und kein Cookie-Banner. Vorher Datenschutzerklärung ergänzen!", name: meta_pixel_id, widget: string, required: false }
          - label: Bar & Café – Preise auf der Startseite
            name: bar_auswahl
            widget: list
            summary: "{{fields.name}} – {{fields.preis}}"
            fields:
              - { label: Getränk, name: name, widget: string }
              - { label: Preis, name: preis, widget: string }
          - { label: "Domain (z. B. https://www.ponte-vecchio-regensburg.de)", name: domain, widget: string }
          - { label: "Bei Google sichtbar machen (erst einschalten, wenn Impressum und Datenschutz fertig sind)", name: suchmaschinen_freigeben, widget: boolean, default: false }

      - name: bestellung
        label: Online-Bestellung & Reservierung
        file: bestellung.json
        format: json
        fields:
          - { label: "WhatsApp-Nummer für Bestellungen und Reservierungen (z. B. +49 15510 621579)", name: whatsapp, widget: string }
          - { label: "Mindestvorlauf in Minuten (frühestmögliche Uhrzeit ab jetzt)", name: vorlauf_minuten, widget: number, value_type: int, default: 30 }
          - { label: "Letzte wählbare Uhrzeit: Minuten vor Schluss", name: letzte_zeit_minuten_vor_schluss, widget: number, value_type: int, default: 30 }
          - { label: "Uhrzeiten im Takt von … Minuten", name: takt_minuten, widget: number, value_type: int, default: 15 }
          - { label: "Reservierung: wie viele Tage im Voraus", name: reservierung_tage_im_voraus, widget: number, value_type: int, default: 14 }
          - { label: "Reservierung: maximale Personenzahl online", name: max_personen, widget: number, value_type: int, default: 8 }
          - { label: "Kategorien, die NICHT bestellbar sind (Name wie in der Speisekarte)", name: kategorien_ausblenden, widget: list, required: false }
          - { label: "Gerichte, die NICHT bestellbar sind (Name, bei gleichem Namen mit Beschreibung, z. B. „Wein 0,25 l“)", name: nicht_bestellbar, widget: list, required: false }
          - { label: "Name der Pizza-Kategorie (bekommt Extrazutaten und „Scharf“)", name: pizza_kategorie, widget: string }
          - { label: "Name der Pasta-Kategorie (bekommt Nudelsorte, Parmesan und „Scharf“)", name: pasta_kategorie, widget: string }
          - { label: "Pasta ohne Nudelauswahl (z. B. Lasagne)", name: pasta_ohne_nudelwahl, widget: list, required: false }
          - { label: "Preis für Extra Parmesan (z. B. 2,00 €)", name: parmesan_extra_preis, widget: string }
          - label: Zusätzliche Artikel nur für die Bestellung (z. B. Weinflasche)
            name: zusaetzlich
            widget: list
            required: false
            summary: "{{fields.name}} – {{fields.preis}}"
            fields:
              - { label: Kategorie (Name wie in der Speisekarte), name: kategorie, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Beschreibung, name: beschreibung, widget: string, required: false }
              - { label: "Preis (z. B. 16,00 €)", name: preis, widget: string }
              - { label: "Auswahl für den Gast, mit Komma getrennt (z. B. Rotwein, Weißwein). Leer = keine Auswahl", name: auswahl, widget: string, required: false }
              - { label: "Größe für die Bestellnachricht (z. B. Flasche 0,75 l)", name: groesse, widget: string, required: false }

      - name: bewertungen
        label: Bewertungen (Startseite)
        file: bewertungen.json
        format: json
        fields:
          - { label: Bereich auf der Startseite anzeigen, name: anzeigen, widget: boolean, default: true }
          - { label: Überschrift, name: ueberschrift, widget: string }
          - { label: "Direkter Bewerten-Link von Google (z. B. https://g.page/r/…/review) – öffnet sofort das Bewertungsfenster", name: google_bewerten_link, widget: string, required: false }
          - { label: "Google Place-ID (nur nötig, wenn kein Bewerten-Link eingetragen ist; beginnt mit ChIJ)", name: google_place_id, widget: string, required: false }
          - { label: "Link zu allen Bewertungen auf Google (optional)", name: google_link, widget: string, required: false }
          - { label: "Durchschnitt auf Google (z. B. 4,8) – leer = nicht anzeigen", name: durchschnitt, widget: string, required: false }
          - { label: "Anzahl Bewertungen auf Google (z. B. 37)", name: anzahl, widget: string, required: false }
          - label: "Ausgewählte Bewertungen (4 oder 6 sehen am schönsten aus, max. 6; nur echte Google-Bewertungen wörtlich übernehmen)"
            name: bewertungen
            widget: list
            max: 6
            summary: "{{fields.name}} – {{fields.sterne}} Sterne"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Sterne, name: sterne, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { label: "Datum (z. B. vor 2 Wochen)", name: datum, widget: string, required: false }
              - { label: Text (wörtlich aus Google), name: text, widget: text }
              - { label: Bild, name: bild, widget: image, required: false }
              - { label: Bildbeschreibung, name: bild_alt, widget: string, required: false }
              - { label: "Beispieltext (Platzhalter) – vor dem Livegang ausschalten", name: beispiel, widget: boolean, default: false }

      - name: rechtliches
        label: Impressum & Datenschutz
        file: rechtliches.json
        format: json
        fields:
          - { label: "Impressum (Überschriften mit ## beginnen, Absätze durch Leerzeile trennen)", name: impressum, widget: text }
          - { label: Impressum ist vollständig, name: impressum_fertig, widget: boolean, default: false }
          - { label: Datenschutzerklärung, name: datenschutz, widget: text }
          - { label: Datenschutzerklärung ist vollständig, name: datenschutz_fertig, widget: boolean, default: false }

      - name: allergene
        label: Allergene & Zusatzstoffe
        file: allergene.json
        format: json
        fields:
          - { label: Einleitungstext, name: einleitung, widget: text }
          - label: Allergene (Erklärung der Buchstaben)
            name: allergene
            widget: list
            summary: "{{fields.code}} – {{fields.name}}"
            fields:
              - { label: Buchstabe (z. B. A), name: code, widget: string }
              - { label: Bezeichnung, name: name, widget: string }
              - { label: "Unterteilung (optional, z. B. A.1 Weizen · A.2 Gerste)", name: unterteilung, widget: string, required: false }
          - label: Kategorien
            name: kategorien
            widget: list
            summary: "{{fields.titel}}"
            fields:
              - { label: Name der Kategorie, name: titel, widget: string }
              - { label: Hinweis (optional), name: hinweis, widget: string, required: false }
              - label: Gerichte
                name: gerichte
                widget: list
                summary: "{{fields.name}} – {{fields.kennzeichnung}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: "Kennzeichnung (z. B. A.1, C, G)", name: kennzeichnung, widget: string }
          - { label: "Fußnote (z. B. * kann Spuren enthalten)", name: fussnote, widget: string, required: false }
          - { label: Schlusshinweis, name: schlusshinweis, widget: string, required: false }
